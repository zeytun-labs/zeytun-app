name: Prepare desktop
description: Restore a verified frontend, locked CLI, compiler and native resources
inputs:
  rust-target:
    description: Native Rust target triple
    required: true
  core-target:
    description: Pinned core and protoc platform
    required: true
  cache-group:
    description: Separate native validation and production release compiler caches
    required: true
  core-source:
    description: Also download corresponding core source for a release
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: .github/tauri-cli/pnpm-lock.yaml
    - name: Install only the locked native CLI
      shell: bash
      run: |
        pnpm --dir .github/tauri-cli install --ignore-workspace --frozen-lockfile
        echo "$GITHUB_WORKSPACE/.github/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - name: Read pinned Rust version
      id: rust
      shell: bash
      run: python -c "import tomllib; print('version=' + tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: ${{ steps.rust.outputs.version }}
        targets: ${{ inputs.rust-target }}
        components: clippy
    - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri
        shared-key: ${{ inputs.rust-target }}-${{ inputs.cache-group }}
        cache-on-failure: false
    - name: Read resource cache identities
      id: resources
      env:
        CORE_TARGET: ${{ inputs.core-target }}
      shell: bash
      run: python scripts/ci-resources.py keys --target "$CORE_TARGET"
    - name: Cache pinned protoc archive
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .cache/protoc-downloads
        key: protoc-v1-${{ inputs.core-target }}-${{ steps.resources.outputs.protoc }}
    - name: Install and verify the pinned Protocol Buffers compiler
      env:
        CORE_TARGET: ${{ inputs.core-target }}
      shell: bash
      run: python scripts/ci-resources.py protoc --target "$CORE_TARGET"
    - name: Restore verified frontend and matching production CSP
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: frontend
        path: .
    - name: Verify restored CSP
      shell: bash
      run: python scripts/check-csp-hashes.py
    - name: Cache pinned core archives
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .cache/core-downloads
        key: core-v1-${{ inputs.core-target }}-${{ inputs.core-source }}-${{ hashFiles('scripts/core-release.json') }}
    - name: Download and validate the pinned production core
      env:
        CORE_TARGET: ${{ inputs.core-target }}
        CORE_SOURCE: ${{ inputs.core-source }}
      shell: bash
      run: |
        args=()
        if [[ "$CORE_SOURCE" == true ]]; then args+=(--source-output zeytun-core-source.tar.gz); fi
        python scripts/download-core.py --target "$CORE_TARGET" "${args[@]}"
    - name: Cache the pinned GeoIP snapshot
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .cache/geoip-downloads
        key: geoip-v1-${{ steps.resources.outputs.geoip }}
        enableCrossOsArchive: true
    - name: Install and validate the pinned GeoIP snapshot
      shell: bash
      run: python scripts/ci-resources.py geoip
