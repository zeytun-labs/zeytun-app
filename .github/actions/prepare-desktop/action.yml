name: Prepare desktop checks
description: Restore verified frontend and pinned core with the shared native toolchain
inputs:
  platform:
    description: Frontend artifact platform
    required: true
  rust-target:
    description: Native Rust target triple
    required: true
  core-target:
    description: Pinned core release target
    required: true
  cache-group:
    description: Separate fast-check and Release dependency caches
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - name: Read pinned Rust version
      id: rust
      shell: bash
      run: python -c "import tomllib; print('version=' + tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: ${{ steps.rust.outputs.version }}
        targets: ${{ inputs.rust-target }}
        components: clippy
    - uses: swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      with:
        workspaces: src-tauri
        shared-key: ${{ inputs.rust-target }}-${{ inputs.cache-group }}
        cache-on-failure: true
    - name: Install protobuf (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install protobuf
    - name: Install protobuf (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install protoc --yes --no-progress
    - name: Install frontend dependencies for the Tauri CLI
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Restore this platform's verified frontend and CSP
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: frontend-${{ inputs.platform }}
        path: .
    - name: Verify restored CSP before native compilation
      shell: bash
      run: python scripts/check-csp-hashes.py
    - name: Download pinned production core
      env:
        CORE_TARGET: ${{ inputs.core-target }}
      shell: bash
      run: python scripts/download-core.py --target "$CORE_TARGET"
    - name: Prepare macOS data resources
      if: runner.os == 'macOS'
      shell: bash
      run: |
        make geoip TARGET=macos-aarch64
        make resources-check repair-dev disk TARGET=macos-aarch64
    - name: Prepare Windows data resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        ./scripts/native-resources.ps1 -Action geoip
        ./scripts/native-resources.ps1 -Action check
