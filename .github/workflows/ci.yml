name: CI

on:
  push:
    branches: [main, windows]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Also build unsigned Release installers for both platforms
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      installers: ${{ steps.plan.outputs.installers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Read pinned Rust version
        id: rust
        run: python -c "import tomllib; print('version=' + tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt
      - name: Select installer checks
        id: plan
        run: python scripts/ci-plan.py
      - name: Check versions
        run: python scripts/dev.py version
      - name: Test development and release tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

  frontend:
    name: Frontend (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            name: Linux
            runner: ubuntu-latest
          - platform: macos
            name: macOS
            runner: macos-15
          - platform: windows
            name: Windows
            runner: windows-latest
    steps:
      - name: Keep checkout line endings consistent across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        run: pnpm check
      - name: Test frontend
        run: pnpm test
      - name: Test portable CSP and core download tooling
        run: |
          python -m unittest discover -s scripts/tests -p 'test_csp.py'
          python -m unittest discover -s scripts/tests -p 'test_core_download.py'
      - name: Build frontend and prepare its CSP
        run: |
          pnpm build
          # Hashes belong to this platform's output, not another runner's build.
          # The synchronizer preserves every other policy directive and setting.
          python scripts/check-csp-hashes.py --write
          python scripts/check-csp-hashes.py
      - name: Save verified frontend and matching Tauri configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ matrix.platform }}
          path: |
            build/
            src-tauri/tauri.conf.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [checks, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            name: macOS
            runner: macos-15
            core_target: macos-aarch64
            target: aarch64-apple-darwin
          - platform: windows
            name: Windows
            runner: windows-latest
            core_target: windows-x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - name: Keep checkout line endings consistent across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-desktop
        with:
          platform: ${{ matrix.platform }}
          rust-target: ${{ matrix.target }}
          core-target: ${{ matrix.core_target }}
          # Preserve the existing desktop cache namespace for fast checks.
          cache-group: desktop
      - name: Lint Rust targets
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --locked --all-targets --all-features -- -D warnings -A clippy::result_large_err
      - name: Test Rust targets
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --locked --all-targets --features updater-tools -- --nocapture
      - name: Smoke-build native app without Release optimization or installers
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: pnpm exec tauri build --ci --debug --no-bundle --no-sign --target "$RUST_TARGET" --config src-tauri/tauri.ci.json -- --locked

  package:
    name: Installer (${{ matrix.name }})
    needs: [checks, frontend]
    if: needs.checks.outputs.installers == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            name: macOS
            runner: macos-15
            core_target: macos-aarch64
            target: aarch64-apple-darwin
            bundles: app,dmg
            installer: dmg/*.dmg
          - platform: windows
            name: Windows
            runner: windows-latest
            core_target: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis
            installer: nsis/*-setup.exe
    steps:
      - name: Keep checkout line endings consistent across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-desktop
        with:
          platform: ${{ matrix.platform }}
          rust-target: ${{ matrix.target }}
          core-target: ${{ matrix.core_target }}
          cache-group: package
      - name: Build unsigned desktop bundles
        env:
          RUST_TARGET: ${{ matrix.target }}
          BUNDLE_FORMATS: ${{ matrix.bundles }}
        # The CI overlay reuses the verified frontend and requires no signing secrets.
        run: pnpm exec tauri build --ci --no-sign --target "$RUST_TARGET" --bundles "$BUNDLE_FORMATS" --config src-tauri/tauri.ci.json -- --locked
      - name: Save unsigned installer for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [checks, frontend, desktop, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check and matrix entry to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          INSTALLERS_REQUIRED: ${{ needs.checks.outputs.installers }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DESKTOP_RESULT" = success
          if [[ "$INSTALLERS_REQUIRED" == true ]]; then
            test "$PACKAGE_RESULT" = success
          else
            test "$INSTALLERS_REQUIRED" = false
            test "$PACKAGE_RESULT" = skipped
          fi
