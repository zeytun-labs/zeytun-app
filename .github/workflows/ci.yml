name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build and smoke-test unsigned installers as well as native checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_validation:
        description: Validate every platform for this exact revision
        type: boolean
        default: false
      build_installers:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      frontend_tests: ${{ steps.plan.outputs.frontend_tests }}
      native: ${{ steps.plan.outputs.native }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Plan checks for the tested revision
        id: plan
        env:
          CI_FULL_VALIDATION: ${{ inputs.full_validation || false }}
          CI_BUILD_INSTALLERS: ${{ inputs.build_installers || false }}
        run: python scripts/ci-plan.py
      - name: Check versions
        run: python scripts/dev.py version
      - name: Validate a release tag before starting builds
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('src-tauri/tauri.conf.json'))['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag must match app version: v{version}')
          PY
      - name: Test development and release tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Read pinned Rust version
        if: steps.plan.outputs.rust == 'true'
        id: rust
        run: python -c "import tomllib; print('version=' + tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: steps.plan.outputs.rust == 'true'
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt
      - name: Check Rust formatting
        if: steps.plan.outputs.rust == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

  frontend:
    name: Frontend
    needs: checks
    if: needs.checks.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Check frontend types
        if: needs.checks.outputs.frontend_tests == 'true'
        run: pnpm check
      - name: Test frontend
        if: needs.checks.outputs.frontend_tests == 'true'
        run: pnpm test
      - name: Build the shared frontend and generate its CSP
        run: make frontend-release csp-check
      - name: Save frontend and its matching production configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend
          path: |
            build/
            src-tauri/tauri.conf.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  native:
    name: Native (${{ matrix.name }})
    needs: [checks, frontend]
    if: needs.checks.outputs.native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      BUNDLE_FORMATS: ${{ matrix.bundles }}
    steps:
      - name: Keep checkout line endings consistent
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-desktop
        with:
          rust-target: ${{ matrix.target }}
          core-target: ${{ matrix.core_target }}
          cache-group: native-v2
      - name: Lint Rust targets
        if: matrix.checks
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --locked --all-targets --all-features -- -D warnings -A clippy::result_large_err
      - name: Test production Rust paths
        if: matrix.checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --locked --all-targets --features updater-tools,ci-smoke
      - name: Test the updater laboratory feature
        if: matrix.checks && matrix.platform == 'macos'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --locked --test updater_security --features updater-lab
      - name: Test the local DNS runtime
        if: matrix.checks && matrix.platform == 'macos'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --locked --test dns_policy --features updater-tools,ci-smoke -- --ignored
      - name: Build the native app
        if: '!matrix.package'
        run: tauri build --ci --debug --no-bundle --no-sign --target "$RUST_TARGET" --features updater-tools,ci-smoke --config src-tauri/tauri.ci.json -- --locked
      - name: Build unsigned installers using the same prepared runner
        if: matrix.package
        run: tauri build --ci --no-sign --target "$RUST_TARGET" --bundles "$BUNDLE_FORMATS" --features ci-smoke --config src-tauri/tauri.ci.json -- --locked
      - name: Smoke-test embedded frontend, WebView, IPC and bundled core
        env:
          SMOKE_PACKAGE: ${{ matrix.package }}
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci-smoke.py --target "$RUST_TARGET" --platform "$SMOKE_PLATFORM" --package "$SMOKE_PACKAGE"
      - name: Save unsigned installer for inspection
        if: matrix.package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 7
      - name: Save runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.platform }}
          path: .cache/smoke-results/
          if-no-files-found: ignore
          retention-days: 3

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [checks, frontend, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci-gate.py
