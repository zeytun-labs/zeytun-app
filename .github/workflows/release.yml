name: Release

# Manual. A tag push must not publish a signed build by itself.
# Needs repo secrets before the first real run:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf
        run: brew install protobuf
      - name: Build zeytun-core
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          TAGS: "with_quic with_grpc with_dhcp with_wireguard with_utls with_acme with_clash_api with_v2ray_api with_gvisor with_embedded_tor with_tailscale with_ccm with_ocm with_cloudflared badlinkname"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch zeytun-port https://github.com/zeytun-labs/zeytun-core.git ../zeytun-core
          cd ../zeytun-core
          go build -trimpath -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=zeytun-ci' -s -w -buildid=" \
            -o zeytun-core ./cmd/sing-box
          dest="$GITHUB_WORKSPACE/src-tauri/resources/bin/macos-aarch64"
          mkdir -p "$dest"
          mv zeytun-core "$dest/zeytun-core"
          url="https://download.db-ip.com/free/dbip-country-lite-$(date -u +%Y-%m).mmdb.gz"
          curl -fsSL --retry 3 "$url" | gunzip > "$GITHUB_WORKSPACE/src-tauri/resources/geoip.mmdb"
      - name: Publish to this repo
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: Zeytun v__VERSION__
          releaseDraft: true
          prerelease: true
          args: --target aarch64-apple-darwin
