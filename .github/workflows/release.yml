name: Release

# Validate the exact tag/manual revision before accessing signing credentials.
# Production releases remain signed macOS drafts for maintainer review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify bundles without signing or creating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate revision
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true
      # The release job builds the production bundle once after validation.
      build_installers: false

  release:
    name: Build macOS release
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-desktop
        with:
          rust-target: aarch64-apple-darwin
          core-target: macos-aarch64
          cache-group: release-v2
          core-source: 'true'
      - name: Validate release settings
        id: metadata
        run: |
          set -euo pipefail
          make version
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match app version: v$version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Require the existing updater signing key
        if: env.DRY_RUN != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo '::error::The existing TAURI_SIGNING_PRIVATE_KEY is required; do not rotate the public key.'
            exit 1
          fi
      - name: Build app and DMG without updater signing
        if: env.DRY_RUN == 'true'
        run: tauri build --ci --target aarch64-apple-darwin --config src-tauri/tauri.release.json --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Create a signed draft using the verified frontend
        if: env.DRY_RUN != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: tauri
          tagName: ${{ steps.metadata.outputs.tag }}
          releaseName: Zeytun v__VERSION__
          releaseDraft: true
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          includeUpdaterJson: true
          args: --ci --target aarch64-apple-darwin --config src-tauri/tauri.release.json -- --locked
      - name: Verify macOS bundle signature and contents
        run: |
          set -euo pipefail
          app='src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Zeytun.app'
          test -s "$app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict "$app"
          python3 scripts/ci-smoke.py --verify-resources "$app/Contents/Resources" --platform macos
      - name: Save dry-run installers for inspection
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-darwin-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Attach corresponding core source and verify the updater manifest
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" zeytun-core-source.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --pattern '*.app.tar.gz' --dir "$RUNNER_TEMP/release-check"
          python3 scripts/verify-release.py \
            --manifest "$RUNNER_TEMP/release-check/latest.json" \
            --artifacts "$RUNNER_TEMP/release-check" --tag "$TAG"
