name: Release

# Tag pushes prepare a signed draft in this repo; publish after reviewing it.
# Manual runs default to a build-only smoke test (no release, no signing secrets).
# Signed releases need the existing updater key in repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build bundles without signing or creating a release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release settings
        id: metadata
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          make version
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match app version: v$version"
            exit 1
          fi
          if [[ "$DRY_RUN" != true && -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Add the existing updater signing key to TAURI_SIGNING_PRIVATE_KEY before releasing. Do not rotate the public key."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.5"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-darwin
      - name: Install protobuf
        run: brew install protobuf
      - name: Build zeytun-core
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch zeytun-port https://github.com/zeytun-labs/zeytun-core.git ../zeytun-core
          make build-core
          git -C ../zeytun-core archive --format=tar.gz --prefix=zeytun-core/ \
            --output="$GITHUB_WORKSPACE/zeytun-core-source.tar.gz" HEAD
          url="https://download.db-ip.com/free/dbip-country-lite-$(date -u +%Y-%m).mmdb.gz"
          curl -fsSL --retry 3 "$url" | gunzip > "$GITHUB_WORKSPACE/src-tauri/resources/geoip.mmdb"
      - name: Check frontend
        run: |
          pnpm run check
          pnpm run build
          python3 scripts/check-csp-hashes.py
      - name: Smoke-test app and DMG bundles
        if: env.DRY_RUN == 'true'
        run: pnpm exec tauri build --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Publish to this repo
        if: env.DRY_RUN != 'true'
        id: publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ steps.metadata.outputs.tag }}
          releaseName: Zeytun v__VERSION__
          releaseDraft: true
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin
      - name: Attach corresponding core source and verify release manifest
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" zeytun-core-source.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/release-check"
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/release-check/latest.json"));
            const platform = manifest.platforms?.["darwin-aarch64"];
            const prefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/`;
            if (manifest.version !== process.env.TAG.slice(1) || !platform?.signature || !platform?.url?.startsWith(prefix)) {
              throw new Error("Release manifest version, signature, or repository URL is invalid");
            }
            console.log(`Verified ${manifest.version}: ${platform.url}`);
          '
